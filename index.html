<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HDHub4U Clone - Download Latest HD Movies</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }
        body { background-color: #0b0c10; color: #c5c6c7; }
        .top-navbar { background-color: #1f2833; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #f5b041; }
        .logo { color: #f5b041; font-size: 1.8rem; font-weight: bold; text-decoration: none; }
        .search-box { padding: 10px 20px; border-radius: 25px; border: 2px solid #45f3ff; background-color: #0b0c10; color: white; outline: none; width: 250px; }
        .category-bar { background-color: #151a21; padding: 10px; text-align: center; }
        .cat-btn { background: none; border: none; color: #c5c6c7; padding: 8px 16px; margin: 0 5px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .cat-btn.active, .cat-btn:hover { background-color: #f5b041; color: #0b0c10; border-radius: 4px; }
        .main-container { max-width: 1200px; margin: 30px auto; padding: 0 15px; }
        .section-title { border-left: 4px solid #f5b041; padding-left: 10px; margin-bottom: 20px; color: #ffffff; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 20px; }
        .movie-card { background-color: #1f2833; border-radius: 5px; overflow: hidden; border: 1px solid #2c3540; transition: 0.3s; position: relative; }
        .movie-card:hover { border-color: #f5b041; transform: translateY(-5px); }
        .poster-box { position: relative; width: 100%; height: 270px; background-color: #151a21; }
        .movie-poster { width: 100%; height: 100%; object-fit: cover; }
        .quality-tag { position: absolute; top: 8px; right: 8px; background-color: #27ae60; color: white; padding: 2px 6px; font-size: 0.75rem; font-weight: bold; border-radius: 3px; }
        .movie-details { padding: 10px; }
        .movie-name { font-size: 0.9rem; font-weight: bold; color: #ffffff; margin-bottom: 10px; height: 40px; overflow: hidden; }
        .download-link { display: block; background-color: #f5b041; color: #0b0c10; text-align: center; padding: 8px; text-decoration: none; font-weight: bold; border-radius: 4px; }
        footer { text-align: center; padding: 20px; background-color: #1f2833; margin-top: 50px; border-top: 2px solid #f5b041; }
    </style>
</head>
<body>
    <div class="top-navbar">
        <a href="#" class="logo">HDHub4U</a>
        <input type="text" id="searchBox" class="search-box" placeholder="Search Movies...">
    </div>
    <div class="category-bar">
        <button class="cat-btn active" onclick="filterCat('all')">All Movies</button>
        <button class="cat-btn" onclick="filterCat('bollywood')">Bollywood</button>
        <button class="cat-btn" onclick="filterCat('hollywood')">Hollywood</button>
    </div>
    <div class="main-container">
        <h2 class="section-title">Latest Movies</h2>
        <div class="movie-grid">
            <div class="movie-card" data-cat="bollywood" data-name="jawan">
                <div class="poster-box"><span class="quality-tag">720p HD</span><img src="https://via.placeholder.com/200x270" class="movie-poster"></div>
                <div class="movie-details"><div class="movie-name">Jawan (2023) Hindi Movie</div><a href="#" class="download-link">Download</a></div>
            </div>
            <div class="movie-card" data-cat="hollywood" data-name="avatar">
                <div class="poster-box"><span class="quality-tag">1080p BDRip</span><img src="https://via.placeholder.com/200x270" class="movie-poster"></div>
                <div class="movie-details"><div class="movie-name">Avatar: The Way of Water</div><a href="#" class="download-link">Download</a></div>
            </div>
        </div>
    </div>
    <footer><p>© 2026 HDHub4U Clone | Technical Sachin</p></footer>
    <script>
        const searchBox = document.getElementById('searchBox');
        const cards = document.querySelectorAll('.movie-card');
        searchBox.addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            cards.forEach(card => {
                card.style.display = card.getAttribute('data-name').includes(val) ? "block" : "none";
            });
        });
        function filterCat(category) {
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            if(event && event.target) event.target.classList.add('active');
            cards.forEach(card => {
                card.style.display = (category === 'all' || card.getAttribute('data-cat') === category) ? "block" : "none";
            });
        }
